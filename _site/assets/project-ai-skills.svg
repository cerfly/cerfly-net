<svg viewBox="0 0 600 400" role="img" aria-label="Terminal window showing the cerfly/ai skills repo" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#0a0a12"/>
    <!-- terminal chrome -->
    <rect x="0" y="0" width="600" height="36" fill="#12121e"/>
    <rect x="0" y="35" width="600" height="1" fill="#1c1c2a"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5" fill="#27c93f"/>
    <text x="300" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#55556e">cerfly/ai — skills</text>
    <!-- terminal body -->
    <g font-family="monospace" font-size="13">
        <text x="40" y="72" fill="#6c63ff">$</text>
        <text x="56" y="72" fill="#e6e6f0">opencode skills list</text>
        <text x="40" y="100" fill="#27c93f">✓</text>
        <text x="56" y="100" fill="#9a9ab0">youtube-summarize</text>
        <text x="240" y="100" fill="#55556e">metadata → captions → transcription</text>
        <!-- workflow diagram -->
        <text x="40" y="140" fill="#6c63ff">$</text>
        <text x="56" y="140" fill="#e6e6f0">summarize https://youtube.com/watch?v=...</text>
        <rect x="40" y="158" width="160" height="26" rx="4" fill="#12121e" stroke="#2a2a3a"/>
        <text x="52" y="175" fill="#9a9ab0">1. metadata (fast)</text>
        <text x="210" y="175" fill="#6c63ff">→</text>
        <rect x="230" y="158" width="140" height="26" rx="4" fill="#12121e" stroke="#2a2a3a"/>
        <text x="242" y="175" fill="#9a9ab0">2. captions</text>
        <text x="380" y="175" fill="#6c63ff">→</text>
        <rect x="400" y="158" width="160" height="26" rx="4" fill="#12121e" stroke="#2a2a3a"/>
        <text x="412" y="175" fill="#9a9ab0">3. transcription</text>
        <!-- output -->
        <text x="40" y="220" fill="#6c63ff">$</text>
        <text x="56" y="220" fill="#e6e6f0">summary.md</text>
        <rect x="40" y="235" width="520" height="105" rx="6" fill="#12121e" stroke="#2a2a3a"/>
        <text x="56" y="258" fill="#6c63ff">## Thesis</text>
        <text x="56" y="278" fill="#9a9ab0">The core argument in 1-2 sentences.</text>
        <text x="56" y="300" fill="#6c63ff">## Chapters</text>
        <text x="56" y="320" fill="#9a9ab0">Chapter-by-chapter breakdown...</text>
    </g>
    <!-- gradient bar -->
    <rect x="0" y="395" width="600" height="5" fill="url(#grad)"/>
    <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6c63ff"/>
            <stop offset="50%" stop-color="#e056fd"/>
            <stop offset="100%" stop-color="#ff6b9d"/>
        </linearGradient>
    </defs>
</svg>