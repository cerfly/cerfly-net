<svg viewBox="0 0 600 400" role="img" aria-label="Terminal window showing the szlib loan tracker output" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#0a0a12"/>
    <!-- terminal chrome -->
    <rect x="0" y="0" width="600" height="36" fill="#12121e"/>
    <rect x="0" y="35" width="600" height="1" fill="#1c1c2a"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5" fill="#27c93f"/>
    <text x="300" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#55556e">szlib — loan tracker</text>
    <!-- terminal body -->
    <g font-family="monospace" font-size="12">
        <text x="40" y="72" fill="#6c63ff">$</text>
        <text x="56" y="72" fill="#e6e6f0">python tracker.py check</text>
        <text x="40" y="98" fill="#27c93f">✓</text>
        <text x="56" y="98" fill="#9a9ab0">logging in to szlib.org.cn (ULAS mobile API)</text>
        <!-- table header -->
        <text x="40" y="130" fill="#6c63ff">#</text>
        <text x="64" y="130" fill="#6c63ff">TITLE</text>
        <text x="240" y="130" fill="#6c63ff">DUE</text>
        <text x="300" y="130" fill="#6c63ff">STATUS</text>
        <line x1="40" y1="138" x2="560" y2="138" stroke="#2a2a3a"/>
        <!-- rows -->
        <text x="40" y="160" fill="#55556e">1</text>
        <text x="64" y="160" fill="#e6e6f0">Four Thousand Weeks</text>
        <text x="240" y="160" fill="#9a9ab0">2026-10-08</text>
        <text x="300" y="160" fill="#27c93f">on time</text>
        <text x="40" y="184" fill="#55556e">2</text>
        <text x="64" y="184" fill="#e6e6f0">The Power of Habit</text>
        <text x="240" y="184" fill="#9a9ab0">2026-10-01</text>
        <text x="300" y="184" fill="#27c93f">on time</text>
        <text x="40" y="208" fill="#55556e">3</text>
        <text x="64" y="208" fill="#e6e6f0">Early Retirement Extreme</text>
        <text x="240" y="208" fill="#9a9ab0">2026-09-21</text>
        <text x="300" y="208" fill="#ff5f56">⚠ OVERDUE</text>
        <line x1="40" y1="222" x2="560" y2="222" stroke="#2a2a3a"/>
        <!-- summary -->
        <text x="40" y="248" fill="#9a9ab0">3 loans · 1 overdue</text>
        <text x="40" y="272" fill="#6c63ff">$</text>
        <text x="56" y="272" fill="#e6e6f0">snapshot → exports/loans_20260918_213000.json</text>
        <text x="56" y="292" fill="#27c93f">✓ credentials encrypted (AES-256-GCM)</text>
    </g>
    <!-- gradient bar -->
    <rect x="0" y="395" width="600" height="5" fill="url(#grad)"/>
    <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6c63ff"/>
            <stop offset="50%" stop-color="#e056fd"/>
            <stop offset="100%" stop-color="#ff6b9d"/>
        </linearGradient>
    </defs>
</svg>